<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Send to Catmagochi</title>
<style>
  :root {
    --bg: #0b0614;
    --bg-panel: #150c26;
    --text: #c9a6ff;
    --text-soft: #8a6bb0;
    --card: #120a1f;
    --border: #7c4dff;
    --primary: #b388ff;
    --glow: rgba(179, 136, 255, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    box-shadow: 0 0 24px var(--glow);
    text-align: center;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    text-shadow: 0 0 8px var(--glow);
  }
  textarea {
    width: 100%;
    min-height: 6rem;
    resize: vertical;
    font: inherit;
    padding: 0.7rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text);
    margin-bottom: 0.75rem;
  }
  button {
    width: 100%;
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 0.7rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--border); color: var(--bg); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { min-height: 1.4em; margin-top: 0.75rem; font-size: 0.85rem; color: var(--text-soft); }
  .status.ok { color: #6fe08a; }
  .status.err { color: #ff5d8f; }
  .link {
    width: auto;
    margin-top: 0.5rem;
    border: none;
    padding: 0.25rem;
    font-size: 0.75rem;
    color: var(--text-soft);
  }
  .link:hover:not(:disabled) { background: transparent; color: var(--primary); }
</style>
</head>
<body>
  <div class="card">
    <h1>Send to Catmagochi</h1>
    <textarea id="text" maxlength="500" placeholder="Say something sweet..."></textarea>
    <button id="send">[ SEND ]</button>
    <div id="status" class="status"></div>
    <button id="reset" class="link">[ change relay ]</button>
  </div>

  <script>
    // The relay URL and token are deliberately NOT written into this file.
    // sender.html is tracked by git, so a token typed here would be published
    // by the next commit -- and rotating it later doesn't remove it from
    // history. They're asked for once and kept in this browser's
    // localStorage instead; "[ change relay ]" below clears them after a
    // rotation. See server/README.md.
    const CONFIG_KEY = 'catmagochi-sender-config-v1'

    const textEl = document.getElementById('text')
    const sendEl = document.getElementById('send')
    const statusEl = document.getElementById('status')
    const resetEl = document.getElementById('reset')

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CONFIG_KEY)
        return raw ? JSON.parse(raw) : null
      } catch {
        return null
      }
    }

    function askForConfig() {
      const url = prompt('Relay URL (e.g. https://your-app-name.fly.dev)')
      if (!url) return null
      const token = prompt('Relay token')
      if (!token) return null
      const config = { url: url.trim().replace(/\/+$/, ''), token: token.trim() }
      try {
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config))
      } catch {
        // Private mode: keep going for this page load, just don't persist.
      }
      return config
    }

    resetEl.addEventListener('click', () => {
      try {
        localStorage.removeItem(CONFIG_KEY)
      } catch {
        // nothing stored to clear
      }
      statusEl.textContent = 'relay settings cleared'
      statusEl.className = 'status'
    })

    sendEl.addEventListener('click', async () => {
      const text = textEl.value.trim()
      if (!text) return
      const config = loadConfig() || askForConfig()
      if (!config) {
        statusEl.textContent = 'relay URL and token are needed to send'
        statusEl.className = 'status err'
        return
      }
      sendEl.disabled = true
      statusEl.textContent = 'sending...'
      statusEl.className = 'status'
      try {
        const res = await fetch(`${config.url}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: config.token, text }),
        })
        if (!res.ok) {
          // A stored token that the relay rejects is never going to start
          // working -- drop it so the next send asks again, instead of
          // failing identically forever until someone finds [ change relay ].
          if (res.status === 401) {
            try {
              localStorage.removeItem(CONFIG_KEY)
            } catch {
              // nothing stored to clear
            }
          }
          throw new Error((await res.json()).error || 'failed')
        }
        textEl.value = ''
        statusEl.textContent = 'sent!'
        statusEl.className = 'status ok'
      } catch (err) {
        statusEl.textContent = 'failed: ' + err.message
        statusEl.className = 'status err'
      } finally {
        sendEl.disabled = false
      }
    })
  </script>
</body>
</html>
